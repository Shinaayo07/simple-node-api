{{- if .Values.serviceAccount.create }}
# customer-api never calls the Kubernetes API (no client-go, no service
# discovery via the apiserver, no leader election - it's a stateless REST API
# backed by an in-memory store). A ServiceAccount is still created so the
# workload has its own identity for auditing/PSA rather than running as
# "default", but its token is deliberately not mounted since there's nothing
# for the pod to authenticate to the apiserver for.
#
# No imagePullSecrets: the image lives in a public Docker Hub repo, so
# kubelet needs no registry credentials at all to pull it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "customer-api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "customer-api.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
