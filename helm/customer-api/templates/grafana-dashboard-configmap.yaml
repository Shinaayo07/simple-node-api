{{- if .Values.dashboard.enabled }}
# Auto-discovered by Grafana's dashboard sidecar (argocd/monitoring/grafana.yaml
# enables sidecar.dashboards.enabled + searchNamespace: ALL) - no manual import
# step, and no coupling to the platform's own Grafana Application. Same "app
# owns its own observability config" pattern as servicemonitor.yaml above:
# this dashboard ships and versions with the app, not the monitoring stack.
#
# Covers the four signals customer-api is asked to demonstrate monitoring
# for: availability (up), HTTP errors (http_requests_total), CPU/memory
# (container_cpu_usage_seconds_total / container_memory_working_set_bytes),
# and request latency (http_request_duration_seconds histogram quantiles).
# Alerting thresholds are documented as panel annotations/description text
# rather than PrometheusRule - visualization only, by design.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "customer-api.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "customer-api.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  customer-api.json: |
    {
      "title": "customer-api - Golden Signals",
      "uid": "customer-api-golden-signals",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "editable": true,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "title": "Availability (% targets up)",
          "description": "Fraction of customer-api scrape targets Prometheus considers up. Suggested alert: page if < 100% for 5m.",
          "type": "stat",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 90 },
                  { "color": "green", "value": 100 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(up{job=\"customer-api\"}) / count(up{job=\"customer-api\"}) * 100",
              "refId": "A"
            }
          ]
        },
        {
          "title": "HTTP Error Rate (5xx)",
          "description": "Share of requests returning 5xx over the last 5m. Suggested alert: warn > 1%, page > 5%.",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percent" } },
          "targets": [
            {
              "expr": "100 * sum(rate(http_requests_total{job=\"customer-api\", status_code=~\"5..\"}[5m])) / sum(rate(http_requests_total{job=\"customer-api\"}[5m]))",
              "legendFormat": "error rate",
              "refId": "A"
            }
          ]
        },
        {
          "title": "CPU Usage",
          "description": "Container CPU usage per pod against the chart's resources.requests.cpu (100m) / limits.cpu (500m). Suggested alert: warn sustained > limit for 10m.",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"customer-api\", pod=~\"customer-api-.*\", container=\"customer-api\"}[5m])) by (pod)",
              "legendFormat": "{{ "{{" }}pod{{ "}}" }}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Memory Usage",
          "description": "Container working-set memory per pod against the chart's resources.requests.memory (128Mi) / limits.memory (256Mi). Suggested alert: warn > 90% of limit for 10m.",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"customer-api\", pod=~\"customer-api-.*\", container=\"customer-api\"}) by (pod)",
              "legendFormat": "{{ "{{" }}pod{{ "}}" }}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Request Latency (p50 / p95 / p99)",
          "description": "Request duration percentiles from the http_request_duration_seconds histogram. Suggested alert: warn p95 > 1s for 5m.",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "fieldConfig": { "defaults": { "unit": "s" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(http_request_duration_seconds_bucket{job=\"customer-api\"}[5m])) by (le))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{job=\"customer-api\"}[5m])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{job=\"customer-api\"}[5m])) by (le))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ]
        }
      ]
    }
{{- end }}
