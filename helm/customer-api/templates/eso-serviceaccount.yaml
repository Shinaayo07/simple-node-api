{{- if and .Values.externalSecrets.enabled (eq .Values.externalSecrets.provider "azurekv") }}
# Deliberately a SEPARATE ServiceAccount from serviceaccount.yaml's app SA.
# That one runs the app pod, has zero permissions, and never mounts a token
# (the app never calls any API). This one exists only so External Secrets
# Operator can federate with Microsoft Entra ID (Azure AD) to read Key
# Vault - it's never referenced by the Deployment.
#
# Only rendered for the azurekv provider - the fake provider (local/kind)
# needs no cloud identity federation, so this SA would just be dead weight
# carrying placeholder Azure IDs.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "customer-api.fullname" . }}-eso
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "customer-api.labels" . | nindent 4 }}
    # Required by AKS's workload-identity mutating webhook.
    azure.workload.identity/use: "true"
  annotations:
    # The User-Assigned Managed Identity (or app registration) granted "Key
    # Vault Secrets User" (read-only, secrets only - NOT the "Crypto User"
    # role the cosign signing identity has) on the vault below, federated to
    # this ServiceAccount's OIDC subject
    # (system:serviceaccount:{{ .Release.Namespace }}:{{ include "customer-api.fullname" . }}-eso).
    azure.workload.identity/client-id: {{ .Values.externalSecrets.workloadIdentity.clientId | quote }}
    azure.workload.identity/tenant-id: {{ .Values.externalSecrets.workloadIdentity.tenantId | quote }}
{{- end }}
