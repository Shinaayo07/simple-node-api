{{- if .Values.externalSecrets.enabled }}
# Demo wiring only: no "{{ .Values.externalSecrets.remoteKey }}" entry exists
# in the Key Vault yet (there's currently nothing this app actually needs to
# keep secret), so ESO will report SecretSyncedError until one is created
# there - that's expected, not a bug. This exists to show the full
# secret-management path end to end, ready for whenever a real secret shows up.
apiVersion: external-secrets.io/v1alpha1
kind: ExternalSecret
metadata:
  name: {{ include "customer-api.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "customer-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ include "customer-api.fullname" . }}-keyvault
    kind: SecretStore
  target:
    name: {{ include "customer-api.fullname" . }}-secrets
    creationPolicy: Owner
  data:
    - secretKey: DEMO_API_KEY
      remoteRef:
        key: {{ .Values.externalSecrets.remoteKey }}
{{- end }}
