apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "customer-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "customer-api.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      {{- include "customer-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "customer-api.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "customer-api.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "customer-api.selectorLabels" . | nindent 14 }}
      containers:
        - name: {{ .Chart.Name }}
          # Pinned by digest, not a mutable tag, matching the cosign-signed
          # artifact the CI pipeline pushes. The GitOps pipeline updates
          # image.digest (not a human editing tags by hand) after each release.
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "customer-api.fullname" . }}-config
            {{- if .Values.externalSecrets.enabled }}
            # Materialized by eso-externalsecret.yaml. optional: true so the
            # pod still starts even when the Key Vault entry behind it
            # doesn't exist yet (see that file's comment) - a missing demo
            # secret shouldn't crash-loop the whole deployment.
            - secretRef:
                name: {{ include "customer-api.fullname" . }}-secrets
                optional: true
            {{- end }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # Root filesystem is read-only; Node needs somewhere writable for
            # any incidental temp-file use (e.g. os.tmpdir()).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
