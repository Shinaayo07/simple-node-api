{{- if .Values.externalSecrets.enabled }}
# Requires the External Secrets Operator CRDs (installed cluster-wide via
# its own Helm chart - cluster infra, out of scope here, same as the
# Prometheus Operator CRDs servicemonitor.yaml depends on).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "customer-api.fullname" . }}-keyvault
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "customer-api.labels" . | nindent 4 }}
spec:
  provider:
  {{- if eq .Values.externalSecrets.provider "fake" }}
    # ESO's own built-in test provider - no cloud dependency. Same
    # ExternalSecret/SecretStore shape as azurekv below, so the local/kind
    # path exercises the real secret-sync machinery instead of disabling it.
    fake:
      data:
        - key: {{ .Values.externalSecrets.remoteKey | quote }}
          value: {{ .Values.externalSecrets.fakeValue | quote }}
  {{- else }}
    azurekv:
      authType: WorkloadIdentity
      # Same Key Vault already used for cosign signing in the CI pipeline,
      # but through a distinct, secrets-only-scoped identity (see
      # eso-serviceaccount.yaml) - this store cannot touch the signing key.
      vaultUrl: {{ .Values.externalSecrets.keyVaultUrl | quote }}
      tenantId: {{ .Values.externalSecrets.workloadIdentity.tenantId | quote }}
      serviceAccountRef:
        name: {{ include "customer-api.fullname" . }}-eso
  {{- end }}
{{- end }}
