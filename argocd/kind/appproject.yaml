apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: customer-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: simple-node-api
spec:
  description: Customer-facing REST API (simple-node-api / customer-api) - local kind mirror
  sourceRepos:
    - https://github.com/Shinaayo07/simple-node-api.git
  destinations:
    - namespace: customer-api
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: policy
      kind: PodDisruptionBudget
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: external-secrets.io
      kind: SecretStore
    - group: external-secrets.io
      kind: ExternalSecret
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
