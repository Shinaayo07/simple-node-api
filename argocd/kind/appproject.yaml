# Kind-only mirror of ../appproject.yaml. A SEPARATE AppProject, not a
# reuse of the AKS one, even though the whitelists are identical - this
# ArgoCD instance lives entirely inside the local kind cluster (installed by
# terraform/kind, not the one on AKS), so there's no shared state to
# collide with. Kept as its own file rather than pointed at the AKS one so
# the two environments' app-trees stay fully independent: editing this file
# can never affect what's deployed to AKS, and vice versa.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: customer-api
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: simple-node-api
spec:
  description: Customer-facing REST API (simple-node-api / customer-api) - local kind mirror
  sourceRepos:
    - https://github.com/Shinaayo07/simple-node-api.git
  destinations:
    - namespace: customer-api
      server: https://kubernetes.default.svc
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: ResourceQuota
    - group: ""
      kind: LimitRange
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: policy
      kind: PodDisruptionBudget
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: external-secrets.io
      kind: SecretStore
    - group: external-secrets.io
      kind: ExternalSecret
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
